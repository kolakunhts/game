<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ghost Chase</title>
    <link rel="stylesheet" href="ຫ.css">
</head>

<body>
    <h1>Ghost Chase</h1>
    <p id="status">ໃຊ້ <b>WASD</b>, <b>ລູກສອນ</b> ຫຼືປຸ່ມສຳຜັດເພື່ອໜີຜີ 👻</p>
    <div class="controls" aria-label="ປຸ່ມຄວບຄຸມ">
        <button id="up">▲</button>
        <div>
            <button id="left">◀</button>
            <button id="down">▼</button>
            <button id="right">▶</button>
        </div>
        <!-- ປຸ່ມນີ້ໃຊ້ກະໂດດທັງເວລາກົດດ້ວຍເມົາ ແລະສຳຜັດດ້ວຍມືຖື -->
        <button id="jump" class="jump-button" aria-label="ກະໂດດ">ກະໂດດ</button>
    </div>
    <div id="game">
        <span id="name">🧘🏻</span>
        <span id="player"> 👻 </span>
    </div>
   
    <script src="my.js"></script>
</body>
</html>
